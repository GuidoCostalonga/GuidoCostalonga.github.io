<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Anteprima riservata</title>
  <style>
    :root { --primary: #084270; --deep: #062E4F; --accent: #F8F06D; --surface: #F7F7F2; --text: #18232D; --muted: #4A5865; --border: #7B8A97; --error: #B3261E; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--surface); color: var(--text);
      font: 18px/1.6 "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif; }
    main { width: 100%; max-width: 420px; background: #fff; border: 1px solid #DCE3E8; border-top: 6px solid var(--accent); border-radius: 10px; padding: 32px; }
    h1 { font: 800 1.6rem/1.2 "Montserrat", "Segoe UI", Arial, sans-serif; color: var(--primary); margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    input { width: 100%; min-height: 48px; padding: 12px 16px; font: inherit; border: 1px solid var(--border); border-radius: 8px; }
    input:focus { outline: 3px solid var(--deep); outline-offset: 1px; box-shadow: 0 0 0 6px var(--accent); }
    button { margin-top: 16px; width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: var(--accent); color: var(--deep); font: 700 1.0625rem "Source Sans 3", Arial, sans-serif; cursor: pointer; }
    button:hover { background: #F2E84A; }
    button[disabled] { opacity: .7; cursor: progress; }
    #avviso { min-height: 1.6em; margin: 12px 0 0; color: var(--error); font-weight: 600; }
    noscript { display: block; margin-top: 16px; color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1>Anteprima riservata</h1>
    <p>Sito in preparazione. Inserisci la parola chiave per consultarlo.</p>
    <form id="accesso" hidden>
      <label for="parola">Parola chiave</label>
      <input id="parola" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entra</button>
      <p id="avviso" role="alert" aria-live="assertive"></p>
    </form>
    <noscript>Per consultare l’anteprima è necessario attivare JavaScript.</noscript>
  </main>

    var MEMORIA = "scocci-chiave";
    function bytes(b) { var s = atob(b), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
    function testo(u) { var s = ""; for (var i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }
    function leggi(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
    function scrivi(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
    function togli(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

    function apri(chiave) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.iv) }, chiave, bytes(D.c)).then(function (buf) {
        var html = new TextDecoder().decode(buf);
        return new Promise(function (fatto) {
          function sostituisci() { document.open(); document.write(html); document.close(); fatto(); }
          // La pagina d'ingresso deve essere completamente caricata prima di essere sostituita
          if (document.readyState === "complete") sostituisci();
          else window.addEventListener("load", function () { setTimeout(sostituisci, 0); }, { once: true });
        });
      });
    }
    function ricava(parola) {
      return crypto.subtle.importKey("raw", new TextEncoder().encode(parola), "PBKDF2", false, ["deriveKey"]).then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(D.s), iterations: D.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
    }

    var modulo = document.getElementById("accesso");
    var avviso = document.getElementById("avviso");
    function mostra() { modulo.hidden = false; document.getElementById("parola").focus(); }

    if (!window.crypto || !crypto.subtle) { modulo.hidden = false; avviso.textContent = "Questo browser non consente di aprire l’anteprima. Usa una versione aggiornata."; return; }

    var salvata = leggi(MEMORIA);
    if (salvata && salvata.indexOf(D.s + "|") === 0) {
      crypto.subtle.importKey("raw", bytes(salvata.split("|")[1]), "AES-GCM", false, ["decrypt"]).then(apri).catch(function () { togli(MEMORIA); mostra(); });
    } else { mostra(); }

    modulo.addEventListener("submit", function (e) {
      e.preventDefault();
      var pulsante = modulo.querySelector("button");
      pulsante.disabled = true; avviso.textContent = "";
      var chiave;
      ricava(document.getElementById("parola").value).then(function (k) {
        chiave = k;
        return crypto.subtle.exportKey("raw", k);
      }).then(function (grezza) {
        scrivi(MEMORIA, D.s + "|" + testo(new Uint8Array(grezza)));
        return apri(chiave);
      }).catch(function () {
        togli(MEMORIA);
        pulsante.disabled = false;
        avviso.textContent = "Parola chiave non corretta. Riprova.";
        document.getElementById("parola").select();
      });
    });
  })();
