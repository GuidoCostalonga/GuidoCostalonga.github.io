name: Aggiorna bandi FVG

on:
  schedule:
    # 06:00 e 16:00 ora di Roma in inverno (CET). In estate è un'ora dopo.
    - cron: "0 5 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bandi-fvg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Sito
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leggi il portale regionale
        run: node .github/bandi/refresh.js bandifvg/catalogo.json

      - name: Pubblica se l'elenco è cambiato
        run: |
          git add bandifvg/catalogo.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna i bandi FVG"
          git push
