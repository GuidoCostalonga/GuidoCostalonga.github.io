# Compila l'app Android "Fatti del Giorno", esegue le prove e lascia l'APK
# fra i file dell'esecuzione (scheda Actions, in fondo alla pagina).
name: Fatti del Giorno · app Android

on:
  push:
    branches:
      - main
    paths:
      - "fatti-del-giorno/**"
      - ".github/workflows/fatti-del-giorno-android.yml"
  pull_request:
    paths:
      - "fatti-del-giorno/**"
      - ".github/workflows/fatti-del-giorno-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Prove e APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ricorda le dipendenze
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fatti-del-giorno-${{ hashFiles('fatti-del-giorno/**/*.gradle.kts', 'fatti-del-giorno/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: fatti-del-giorno-

      - name: Prove automatiche
        working-directory: fatti-del-giorno
        run: ./gradlew --no-daemon testPubblicaUnitTest

      - name: Compila l'APK e controlla il codice
        working-directory: fatti-del-giorno
        run: ./gradlew --no-daemon assemblePubblica lintPubblica

      - name: Metti a disposizione l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FattiDelGiorno-apk
          if-no-files-found: error
          retention-days: 60
          path: fatti-del-giorno/app/build/outputs/apk/pubblica/*.apk

      - name: Metti a disposizione i resoconti, se qualcosa non torna
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resoconti-fatti-del-giorno
          if-no-files-found: ignore
          path: |
            fatti-del-giorno/app/build/reports/**
            fatti-del-giorno/app/build/outputs/lint-results-*.html
