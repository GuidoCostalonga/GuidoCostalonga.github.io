<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Studio DSA Offline: quaderno digitale compensativo. Funziona senza Internet, i dati restano sul dispositivo.">
<meta name="theme-color" content="#1d4e6f">
<title>Studio DSA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#contenuto">Vai al contenuto</a>

<!-- ===================== BARRA SUPERIORE ===================== -->
<header class="topbar" id="topbar">
  <button type="button" class="topbar-home" id="btnHome" aria-label="Torna alla home">
    <span aria-hidden="true">🏠</span>
    <span class="topbar-title">Studio DSA</span>
  </button>
  <div class="topbar-actions">
    <button type="button" class="topbar-btn" id="btnStampa" aria-label="Stampa questa pagina in A4">
      <span aria-hidden="true">🖨️</span><span class="topbar-btn-label">Stampa</span>
    </button>
    <button type="button" class="topbar-btn" id="btnCerca" aria-label="Cerca nei miei materiali">
      <span aria-hidden="true">🔍</span><span class="topbar-btn-label">Cerca</span>
    </button>
    <button type="button" class="topbar-btn" id="btnImpostazioni" aria-label="Impostazioni">
      <span aria-hidden="true">⚙️</span><span class="topbar-btn-label">Impostazioni</span>
    </button>
  </div>
</header>

<!-- Intestazione che compare solo sul foglio stampato -->
<div class="intestazione-stampa solo-stampa" id="intestazioneStampa"></div>

<!-- ===================== CONTENUTO ===================== -->
<main id="contenuto" class="main" tabindex="-1">
  <noscript>
    <div class="card">
      <h1>Serve JavaScript</h1>
      <p>Questa applicazione funziona solo se il browser può eseguire JavaScript.
         Non serve Internet: serve solo attivare JavaScript nelle impostazioni del browser.</p>
    </div>
  </noscript>
  <div id="vista" class="vista"><!-- riempita da app.js --></div>
</main>

<!-- ===================== BARRA IN BASSO (mobile) ===================== -->
<nav class="tabbar" id="tabbar" aria-label="Sezioni principali"></nav>

<!-- ===================== ELEMENTI DI SERVIZIO ===================== -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modale" class="modale" hidden></div>
<div id="righello" class="righello" hidden aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
