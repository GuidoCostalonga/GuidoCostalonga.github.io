<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mappa di Roveredo in Piano (PN)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; }
    .titolo {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(255,255,255,0.92); padding: 8px 16px;
      border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 15px; font-weight: 600; color: #084270; pointer-events: none;
    }
    .titolo small { display:block; font-weight:400; color:#555; font-size:12px; }
  </style>
</head>
<body>
  <div class="titolo">Roveredo in Piano (PN)<small>46,0103 N · 12,6201 E — 33080, Provincia di Pordenone</small></div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const lat = 46.0103337, lng = 12.6200637;
    const map = L.map('map').setView([lat, lng], 14);

    const strade = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const satellite = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics'
    });

    L.control.layers(
      { 'Stradale (OSM)': strade, 'Satellite (Esri)': satellite },
      null, { collapsed: false }
    ).addTo(map);

    L.marker([lat, lng]).addTo(map)
      .bindPopup('<b>Roveredo in Piano</b><br>Provincia di Pordenone (FVG)<br>CAP 33080')
      .openPopup();
  </script>
</body>
</html>
